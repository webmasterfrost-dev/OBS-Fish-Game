<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fishing Minigame Overlay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="catch-container" class="hidden">
        <!-- Text sits stacked at the top of the container box -->
        <div id="catch-text"></div>
        <!-- Video sits right underneath the text with rounded corners -->
        <video id="fishing-video" autoplay muted playsinline></video>
    </div>

    <script src="app.js"></script>
</body>
</html>
